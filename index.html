<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pañol Digital</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111D2A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pañol">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Diseño Fluor-Salfa: azul marino de marca para acciones y encabezado, granate como franja de marca; tarjetas limpias con sombra suave; barra inferior flotante */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --sunk:#E9EEF4; --ink:#0F1E2E; --muted:#5A6878; --line:#DCE3EB;
  --navy:#004478; --navy-2:#0B5C9E; --maroon:#920028;
  --accent:#004478; --accent-ink:#FFFFFF; --accent-soft:#E2ECF6; --ok-btn:#1C7A45;
  --hero-1:#004478; --hero-2:#062F55; --chip:#FFFFFF;
  --ok:#1C7A45; --ok-soft:#DFF2E6; --warn:#9A6200; --warn-soft:#FCF0D4; --bad:#B0203A; --bad-soft:#FADFE4;
  --shadow:0 1px 2px rgba(15,30,46,.06),0 6px 18px rgba(15,30,46,.06);
  --shadow-lg:0 10px 30px rgba(0,40,80,.18);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A121C; --surface:#111D2A; --sunk:#192838; --ink:#E8EEF5; --muted:#93A3B5; --line:#223447;
  --navy:#6EA8E8; --navy-2:#3F82CC; --maroon:#E8607A;
  --accent:#2C6BB3; --accent-ink:#FFFFFF; --accent-soft:#15304C; --ok-btn:#1C8049;
  --hero-1:#0C3A66; --hero-2:#08223D; --chip:#FFFFFF;
  --ok:#5CD08A; --ok-soft:#12301F; --warn:#F2C04E; --warn-soft:#33290F; --bad:#FF7F93; --bad-soft:#3A1720;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
  --shadow-lg:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px}
[hidden]{display:none!important}
p{margin:0}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;
  box-shadow:0 1px 0 var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--navy) 0 68%,var(--maroon) 68% 100%)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:block;background:var(--chip);border-radius:7px;padding:4px 6px;line-height:0;flex:none}
.logo img{height:22px;width:auto;display:block}
.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15;padding-top:2px;color:var(--navy);min-width:0}
.brand b{color:var(--maroon);font-weight:700}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--muted);text-transform:none;margin-top:3px;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.clock{flex:none;margin-left:auto;white-space:nowrap;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
#turno{display:inline-block;margin-top:2px;font-family:var(--f-body);font-weight:600;font-size:10px;letter-spacing:.06em;color:var(--navy);background:var(--accent-soft);border-radius:999px;padding:1px 7px}
.gear{background:var(--sunk);border:0;color:var(--navy);padding:7px;cursor:pointer;border-radius:10px;flex:none}
.gear svg{width:20px;height:20px;display:block}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px var(--warn-soft)}
.sync.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.sync.off{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
@media (max-width:440px){.top-in{gap:8px}.logo img{height:18px}.logo{padding:4px 5px}.clock #clock{display:none}.clock br{display:none}.brand{font-size:16px}.brand small{font-size:10.5px}#turno{font-size:9px;padding:1px 6px}.sync{margin-right:4px}.gear{padding:6px}.gear svg{width:19px;height:19px}}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(112px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;color:var(--ink)}
h3{font-family:var(--f-body);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin:0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec{display:grid;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono)}

/* Resumen: tarjeta azul de marca */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:18px;overflow:hidden;position:relative;
  background:radial-gradient(120% 140% at 100% 0%,rgba(146,0,40,.38) 0,rgba(146,0,40,0) 46%),linear-gradient(140deg,var(--hero-1),var(--hero-2));box-shadow:var(--shadow-lg)}
.stat{background:transparent;border:0;color:#fff;padding:16px 14px 14px;display:grid;gap:6px;text-align:left;cursor:pointer;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:rgba(255,255,255,.18)}
.stat:hover{background:rgba(255,255,255,.06)}
.stat .n{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:.9;font-variant-numeric:tabular-nums;color:#fff}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:6px}
.stat .l::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
.stat.ok .l::before{background:#6EE19A} .stat.warn .l::before{background:#FFD36B} .stat.bad .l::before{background:#FF8FA3}
.stat.ok .n,.stat.warn .n,.stat.bad .n{color:#fff}

/* Botones */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(15,30,46,.05);transition:transform .08s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(160deg,var(--navy-2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 16px rgba(0,68,120,.28)}
.btn.okb{background:var(--ok-btn);border-color:var(--ok-btn);color:#fff;box-shadow:0 6px 16px rgba(28,122,69,.25)}
.btn.badb{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.badb.armed{background:var(--bad);color:#fff}
.btn.big{min-height:60px;font-size:18px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;width:100%;border-radius:16px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--navy)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:22px;height:22px;flex:none}

/* Formularios */
.codeform{display:flex;gap:8px}.codeform input{flex:1;min-width:0}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;min-height:48px;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:72px;resize:vertical}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.mono-in{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.mono-in::placeholder{text-transform:none;font-family:var(--f-body);letter-spacing:0}

/* Listas */
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 14px;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;width:100%;transition:background .12s ease}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.item .main{min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.code{font-family:var(--f-mono);font-weight:700;font-size:12.5px;background:var(--accent-soft);color:var(--navy);border:0;border-radius:8px;padding:5px 8px;white-space:nowrap}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.pill.disponible{background:var(--ok-soft);color:var(--ok)}
.pill.prestada{background:var(--warn-soft);color:var(--warn)}
.pill.mantencion{background:var(--bad-soft);color:var(--bad)}
.pill.ej{background:var(--sunk);color:var(--muted)}
.time{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:600}
.time.late{color:var(--bad);font-weight:700}
.late-tag{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.time.late .late-tag{color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.empty strong{color:var(--ink)}

/* Ficha de herramienta: tag de pañol */
.tag{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px 20px 66px;display:grid;gap:14px;box-shadow:var(--shadow);overflow:hidden}
.tag::before{content:"";position:absolute;left:21px;top:24px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--line);box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.tag::after{content:"";position:absolute;left:54px;top:0;bottom:0;border-left:2px dashed var(--line)}
.tag .plate{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag .plate .code{font-size:19px;padding:6px 11px;background:var(--accent);color:#fff}
.tag .tname{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.02;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.holder{background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:grid;gap:2px;border-left:4px solid var(--warn)}
.holder .who{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;line-height:1.1}
.holder.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.qrbox{display:flex;gap:14px;align-items:center}
.qrbox .qr{background:#fff;padding:7px;border-radius:10px;flex:none;border:1px solid var(--line)}
.qrbox .qr img,.qrbox .qr canvas{display:block}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.seg input{accent-color:var(--accent);width:18px;height:18px}
.seg label:has(input:checked){border-color:var(--navy-2);background:var(--accent-soft);color:var(--navy)}
.seg label:has(#d-dano:checked){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Historial */
.log{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.logi{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.logi:first-child{border-top:0}
.logi .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.35;font-weight:600}
.logi .what{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.retiro{background:var(--warn)}.dot.devolucion,.dot.habilitada{background:var(--ok)}.dot.mantencion{background:var(--bad)}.dot.alta{background:var(--navy-2)}
.daysep{padding:7px 14px;background:var(--sunk);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);border-top:1px solid var(--line)}
.daysep:first-child{border-top:0}
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--navy) 30%,transparent);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.keybox{font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:.06em;background:var(--accent-soft);color:var(--navy);border-radius:12px;padding:12px;text-align:center;user-select:all;overflow-wrap:anywhere}

/* Pantalla de entrada */
.hero-login{display:grid;justify-items:center;gap:12px;text-align:center;padding:10px 0 4px}
.hero-login .lg{background:var(--chip);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);line-height:0}
.hero-login .lg img{height:38px;width:auto}
.hero-login .ttl{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.03em;text-transform:uppercase;line-height:1;color:var(--navy)}
.hero-login .ttl b{color:var(--maroon)}

/* Barra inferior flotante */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg)}
nav.tabs button{background:none;border:0;padding:8px 2px;display:grid;justify-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:14px;transition:background .15s ease,color .15s ease}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current=page]{color:var(--navy);background:var(--accent-soft)}

/* Escáner en vivo */
.scan{position:fixed;inset:0;z-index:30;background:#000;display:grid;grid-template-rows:auto 1fr auto}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .bar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));color:#fff;background:linear-gradient(#000a,#0000)}
.scan .bar strong{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.scan .frame{position:relative;z-index:2;align-self:center;justify-self:center;width:min(70vw,300px);aspect-ratio:1;max-width:100%;border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,10,25,.55)}
.scan .frame::before{content:"";position:absolute;inset:0;border:4px solid #fff;border-radius:22px;
  -webkit-mask:linear-gradient(#000 0 0) top left/36px 36px no-repeat,linear-gradient(#000 0 0) top right/36px 36px no-repeat,linear-gradient(#000 0 0) bottom left/36px 36px no-repeat,linear-gradient(#000 0 0) bottom right/36px 36px no-repeat;
  mask:linear-gradient(#000 0 0) top left/36px 36px no-repeat,linear-gradient(#000 0 0) top right/36px 36px no-repeat,linear-gradient(#000 0 0) bottom left/36px 36px no-repeat,linear-gradient(#000 0 0) bottom right/36px 36px no-repeat}
.scan .frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#E8607A;box-shadow:0 0 14px #E8607A}
@media (prefers-reduced-motion:no-preference){.scan .frame::after{animation:sweep 1.8s ease-in-out infinite alternate}@keyframes sweep{from{top:10%}to{top:90%}}}
.scan .foot{position:relative;z-index:2;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#fff;text-align:center;display:grid;gap:10px;background:linear-gradient(#0000,#000a)}
.scan .ibtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.scan .ibtn[aria-pressed=true]{background:#fff;border-color:#fff;color:#004478}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:#0F2A45;color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
@media (max-width:380px){.stat .n{font-size:34px}.stat{padding:14px 10px 12px}.tag{padding-left:54px}.tag::before{left:16px}.tag::after{left:44px}}

/* Hoja de etiquetas: solo al imprimir */
#print{display:none}
@media print{
  @page{size:auto;margin:10mm}
  body{background:#fff;padding:0}
  body::before,.top,main,nav.tabs,.toast,.scan{display:none!important}
  #print{display:grid;grid-template-columns:repeat(3,62mm);gap:4mm;color:#000}
  .lb{width:62mm;height:30mm;border:1.2px dashed #777;border-radius:3mm;display:flex;align-items:center;gap:2.5mm;padding:2mm;break-inside:avoid;page-break-inside:avoid;font-family:Arial,Helvetica,sans-serif}
  .lb>img{width:25mm;height:25mm;flex:none}
  .lb .tx{min-width:0;display:flex;flex-direction:column;gap:1mm}
  .lb .cd{font:700 6.5mm/1 "Courier New",monospace;background:#004478;color:#fff;padding:1mm 1.5mm;border-radius:1mm;align-self:flex-start;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .lb .nm{font-size:3.1mm;font-weight:700;line-height:1.15;text-transform:uppercase;overflow:hidden;max-height:7.2mm}
  .lb .ft{font-size:2mm;color:#333}
  .lb .lgo{height:3.4mm;width:auto;align-self:flex-start;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== Ampliaciones v2 ===== */
.stats{grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3)::before{display:none}.stat:nth-child(n+3){border-top:1px solid rgba(255,255,255,.14)}}
.stat.lost .l::before{background:#C9B6FF}
nav.tabs .in{grid-template-columns:repeat(5,1fr);max-width:560px}
nav.tabs button{font-size:9.5px;letter-spacing:.04em}
.pill.extraviada{background:#ECE6FB;color:#5B3FA6}
@media (prefers-color-scheme:dark){.pill.extraviada{background:#2A2145;color:#C9B6FF}}
.pill.calv{background:var(--bad-soft);color:var(--bad)} .pill.calp{background:var(--warn-soft);color:var(--warn)}
.ro-banner{background:var(--accent-soft);color:var(--navy);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
body.ro .w{display:none!important}

/* Alertas */
.alerts{display:grid;gap:8px}
.alert{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.alert.bad{border-left-color:var(--bad)} .alert.info{border-left-color:var(--navy-2)}
.alert .ic{font-family:var(--f-display);font-weight:700;font-size:24px;min-width:28px;text-align:center;color:var(--warn)}
.alert.bad .ic{color:var(--bad)} .alert.info .ic{color:var(--navy-2)}
.alert .tx{font-weight:600;font-size:14px;min-width:0}
.alert .tx small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}

/* Más */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:6px;text-align:left;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.tile svg{width:28px;height:28px;color:var(--navy)}
.tile strong{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.tile span{font-size:12.5px;color:var(--muted)}
.tile .badge{justify-self:start;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--bad-soft);color:var(--bad)}

/* Carrito de retiro múltiple */
.cart{display:grid;gap:6px}
.cart .ci{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px 10px}
.cart .ci .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cart .ci button{background:none;border:0;color:var(--bad);font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px}
.count-badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:0 7px}

/* Firma */
.sig{display:grid;gap:6px}
.sig canvas{width:100%;height:140px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.sig .row{justify-content:space-between}
.sigimg{background:#fff;border-radius:8px;border:1px solid var(--line);max-width:220px;height:auto;display:block}

/* Foto */
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.fullphoto{width:100%;max-width:100%;border-radius:12px;border:1px solid var(--line);display:block}

/* Barras de estadísticas */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .lb2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .tr{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--navy-2),var(--accent));border-radius:999px}
.bar.mar .fl{background:linear-gradient(90deg,#C23A55,var(--maroon))}
.bar .vl{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .n{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--navy)}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* Stock */
.stock{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right;line-height:1}
.stock small{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stock.low{color:var(--bad)}
.bigstock{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1;color:var(--navy)}
.bigstock.low{color:var(--bad)}

/* Importar */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{background:var(--sunk);font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.05em}
.tbl td.err{color:var(--bad);font-weight:600}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* Izaje */
.verdict{border-radius:16px;padding:18px;display:grid;gap:4px;color:#fff;box-shadow:var(--shadow-lg)}
.verdict.apto{background:linear-gradient(140deg,#1C7A45,#125630)}
.verdict.no{background:linear-gradient(140deg,#B0203A,#7A1024)}
.verdict .big2{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;text-transform:uppercase}
.verdict .why{font-weight:600}
.verdict .warnline{background:rgba(0,0,0,.22);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;margin-top:6px}
.wll{display:inline-flex;align-items:baseline;gap:6px;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;width:max-content;max-width:100%}
.wll .v{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1}
.wll .u{font-family:var(--f-display);font-weight:600;font-size:18px}
.wll .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.colorcall{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.colorcall .sw{width:40px;height:40px;border-radius:10px;border:2px solid rgba(0,0,0,.2);flex:none}
.colorcall strong{font-family:var(--f-display);font-size:22px;text-transform:uppercase;line-height:1}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:6px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:500}
.checks input{width:20px;height:20px;accent-color:var(--bad);flex:none}
.checks label:has(input:checked){border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.btn.badf{background:var(--bad);border-color:var(--bad);color:#fff}
.colors{display:grid;gap:8px}.colors .cr{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
input[type=number],input[type=date]{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;min-height:48px}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.backbar .btn{flex:none;white-space:nowrap}.backbar h2{min-width:0}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
@media print{
  .lb .wl{font-size:4.4mm;font-weight:700}
  .lb .cq{font-size:2.6mm;color:#333}
}

/* Panel de control (pantalla principal) */
.dash{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dash::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--navy) 0 68%,var(--maroon) 68% 100%)}
.dash-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dash-t{font-family:var(--f-body);font-size:19px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink)}
.dash-hd .small{display:block;margin-top:2px}
.dash-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--navy);display:grid;place-items:center;flex:none}
.dash-ic svg{width:26px;height:26px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kc{background:var(--sunk);border:1px solid transparent;border-radius:16px;padding:14px;display:grid;gap:4px;text-align:left;cursor:pointer;color:var(--ink);min-width:0;transition:border-color .15s ease,transform .08s ease}
.kc:hover{border-color:var(--line)} .kc:active{transform:translateY(1px)}
.kc .kl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.kc .kl svg{width:20px;height:20px;flex:none;color:var(--navy)}
.kc.ok .kl svg{color:var(--ok)} .kc.warn .kl svg{color:var(--warn)} .kc.bad .kl svg{color:var(--bad)}
.kc .kn{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:4px}
.kc.bad .kn{color:var(--bad)}
.kc .ks{font-size:11.5px;color:var(--muted);line-height:1.3}
.qa-t{font-family:var(--f-body);font-size:15px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);margin-top:2px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qb{display:grid;justify-items:center;gap:8px;padding:16px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);font-weight:700;font-size:14px;box-shadow:0 1px 2px rgba(15,30,46,.05);transition:background .15s ease,transform .08s ease,border-color .15s ease}
.qb svg{width:28px;height:28px;color:var(--navy)}
.qb:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--navy) 35%,transparent)} .qb:active{transform:translateY(1px)}
.qb:first-child{background:linear-gradient(160deg,var(--navy-2),var(--accent));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(0,68,120,.28)}
.qb:first-child svg{color:#fff}
@media (max-width:380px){.kc .kn{font-size:36px}.kc{padding:12px}}

</style>
</head>

<script>
(function(){
/* ================= Configuración ================= */
const SHIFT_H = 12;            // horas prestada antes de marcar "pasó el turno"
const AVISO_DIAS = 30;         // días de aviso antes de vencer calibración / certificado
const LS_KEY = "panol.clave", LS_ROL = "panol.rol";
const BASE = location.origin + location.pathname;
const LOGO = document.getElementById("logoImg").src;
const S = { tools:[], movs:[], workers:[], cons:[], cmovs:[], iz:[], izi:[], config:{}, izcfg:{},
  view:"panol", sel:null, wsel:null, csel:null, zsel:null, filter:"todos", q:"", wq:"", cq:"", zq:"", zfilter:"todos",
  loaded:false, phase:"boot", pendingWrites:false, err:"", ro:false, pending:null,
  addOpen:false, addCode:"", editOpen:false, armed:null, noReset:false,
  cart:{worker:"", items:[], area:""}, sig:{}, photo:{}, imp:{tipo:"tools", rows:null, name:""},
  wAdd:false, wEdit:false, cAdd:false, cEdit:false, zAdd:false, zEdit:false, zInsp:false, zFuera:false, cfgIz:false,
  extOpen:false, retOpen:false, scanMode:"single" };
let fs=null, K=null, unsubs=[], toastT=null, armT=null, installEvt=null;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normCode = v => String(v||"").trim().toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9-]/g,"").slice(0,24);
const normKey = v => String(v||"").trim().toUpperCase().replace(/[^A-Z0-9-]/g,"");
const clean = v => String(v||"").trim().replace(/\s+/g," ");
const ESTADO = {disponible:"Disponible", prestada:"Prestada", mantencion:"Mantención", extraviada:"Extraviada"};
const TIPO = {retiro:"Retiro", devolucion:"Devolución", mantencion:"A mantención", habilitada:"Habilitada", alta:"Alta en inventario", extraviada:"Extraviada", recuperada:"Recuperada"};
const fmtT = ts => new Date(ts).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const fmtD = ts => new Date(ts).toLocaleDateString("es-CL",{weekday:"short",day:"2-digit",month:"2-digit"});
const fmtF = iso => { if(!iso) return "—"; const [y,m,d]=String(iso).split("-"); return `${d}-${m}-${y}`; };
const fmtDur = ms => { const m=Math.max(0,Math.floor(ms/60000)); const h=Math.floor(m/60); return h?`${h} h ${String(m%60).padStart(2,"0")} min`:`${m} min`; };
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayISO = () => isoOf(new Date());
const daysTo = iso => Math.round((new Date(iso+"T12:00:00") - new Date(todayISO()+"T12:00:00"))/864e5);
const num = v => { const n=Number(String(v??"").replace(",",".")); return isFinite(n)?n:0; };
const fmtN = v => String(Math.round(num(v)*100)/100).replace(".",",");
const toolBy = c => S.tools.find(t=>t.id===c);
const workerBy = id => S.workers.find(w=>w.id===id);
const consBy = id => S.cons.find(c=>c.id===id);
const izBy = c => S.iz.find(t=>t.id===c);
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const catsUsadas = () => [...new Set(S.tools.map(t=>clean(t.categoria)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
const ubisUsadas = () => [...new Set([...S.tools,...S.cons].map(t=>clean(t.ubicacion)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{numeric:true}));
const cuadrillas = () => [...new Set(S.workers.map(w=>clean(w.cuadrilla)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
const dl = (id,arr) => `<datalist id="${id}">${arr.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;

function toast(msg){ const o=$(".toast"); if(o) o.remove(); clearTimeout(toastT);
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=msg; document.body.appendChild(el); toastT=setTimeout(()=>el.remove(),3600); }
function tick(){ const n=new Date(); $("#clock").textContent=n.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit"})+" "+fmtT(n);
  const h=n.getHours(); $("#turno").textContent=(h>=8&&h<20)?"TURNO DÍA":"TURNO NOCHE"; }
function setSync(){ const el=$("#sync"); const off=!navigator.onLine;
  el.className="sync"+(off?" off":(S.pendingWrites||!S.loaded)?"":" on");
  el.title= off?"Sin señal: los cambios se guardan y se suben al volver la señal": S.pendingWrites?"Subiendo cambios…":"Sincronizado"; }

/* ================= Trabajadores ================= */
const wLabel = w => w.nombre + (w.cuadrilla?` · ${w.cuadrilla}`:"");
function resolveWorker(txt){
  const t=clean(txt); if(!t) return null; const low=t.toLowerCase();
  const w=S.workers.find(w=>wLabel(w).toLowerCase()===low) || S.workers.find(w=>w.nombre.toLowerCase()===low) || S.workers.find(w=>(w.rut||"").toLowerCase()===low);
  return w ? {workerId:w.id, persona:w.nombre, cuadrilla:w.cuadrilla||""} : {workerId:null, persona:t, cuadrilla:""};
}
const workersDl = () => dl("dl-w", S.workers.filter(w=>w.activo!==false).map(wLabel).sort((a,b)=>a.localeCompare(b,"es")));
const workerId = (rut,nombre) => { const r=String(rut||"").toUpperCase().replace(/[^0-9K]/g,""); return r.length>=7 ? "R"+r : "W-"+nombre.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)+"-"+Math.random().toString(36).slice(2,5); };

/* ================= Calibración ================= */
function calib(t){ if(!t.calibVence) return null; const d=daysTo(t.calibVence);
  if(d<0) return {code:"v", txt:`Calibración vencida el ${fmtF(t.calibVence)}`};
  if(d<=AVISO_DIAS) return {code:"p", txt:`Calibración vence en ${d} día${d===1?"":"s"} (${fmtF(t.calibVence)})`};

/* ================= Izaje ================= */

const DEF_TRIM=["Rojo","Verde","Amarillo","Azul"], DEF_MES=["Rojo","Verde","Amarillo","Azul","Rojo","Verde","Amarillo","Azul","Rojo","Verde","Amarillo","Azul"];
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const TIPOS_IZ = {

  "Cadena":["Eslabones estirados o deformados","Desgaste excesivo en eslabones","Fisuras o cortes","Corrosión","Gancho o anillo maestro dañado","Placa de identificación faltante"],
  "Grillete":["Cuerpo deformado o abierto","Pasador doblado o hilo dañado","Pasador no original","Desgaste excesivo","Fisuras","Marcas de capacidad ilegibles"],
  "Gancho":["Abertura de garganta aumentada","Torsión o doblez","Pestillo dañado o faltante","Fisuras","Desgaste en el asiento"],
  "Tecle de cadena":["Freno no retiene la carga","Cadena estirada, torcida o dañada","Ganchos deformados o sin pestillo","Mecanismo trabado o con ruido","Placa de capacidad ilegible"],
  "Tecle de palanca":["Freno no retiene la carga","Cadena o cable dañado","Ganchos deformados o sin pestillo","Palanca o trinquete dañado","Placa de capacidad ilegible"],
  "Otro (cáncamo, tensor, barra)":["Deformación","Fisuras","Desgaste o corrosión","Hilo dañado","Marcas de capacidad ilegibles"]};
const hex = n => COLORES[n]||"#8C8F8F";
const izFreq = () => S.izcfg.freq==="mensual"?"mensual":"trimestral";
const izCols = () => { const c=S.izcfg.colores, d=izFreq()==="mensual"?DEF_MES:DEF_TRIM; return (Array.isArray(c)&&c.length===d.length)?c:d; };
function periodo(d=new Date()){ const y=d.getFullYear(), m=d.getMonth();
  if(izFreq()==="mensual") return {key:`${y}-M${m+1}`, label:`${MESES[m]} ${y}`, color:izCols()[m]};
  const t=Math.floor(m/3); return {key:`${y}-T${t+1}`, label:`${MESES[t*3]}–${MESES[t*3+2]} ${y}`, color:izCols()[t]}; }
function izEstado(it){ const P=periodo(); let warn=null;
  if(it.certVence){ const d=daysTo(it.certVence); if(d>=0&&d<=AVISO_DIAS) warn=`Certificado vence en ${d} día${d===1?"":"s"} (${fmtF(it.certVence)})`; }
  if(it.fuera) return {code:"fuera", why:"Fuera de servicio"+(it.motivo?": "+it.motivo:"")};
  if(!it.insp) return {code:"sin", why:"Sin inspección registrada", warn};
  if(it.insp.periodo!==P.key) return {code:"vencida", why:`Falta la inspección de ${P.label} (color ${P.color.toLowerCase()})`, warn};
  if(it.certVence&&daysTo(it.certVence)<0) return {code:"cert", why:`Certificado vencido el ${fmtF(it.certVence)}`};
  return {code:"apto", why:"Inspección vigente del período", warn}; }

function sigBox(id){ return `<div class="sig"><span class="small muted" style="font-weight:600">Firma de quien retira</span><canvas id="${id}" aria-label="Recuadro para firmar"></canvas>
  <div class="row"><span class="small muted">Firma con el dedo dentro del recuadro.</span><button class="btn ghost" type="button" data-act="sig-clear" data-id="${id}">Borrar firma</button></div></div>`; }
function initSig(id){
  const c=document.getElementById(id); if(!c) return; const r=c.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
  c.width=Math.max(10,Math.round(r.width*dpr)); c.height=Math.round(140*dpr);
  const ctx=c.getContext("2d"); ctx.scale(dpr,dpr); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0F1E2E";
  if(S.sig[id]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,140); im.src=S.sig[id]; }
  let drawing=false, last=null;
  const pos=e=>{ const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  c.onpointerdown=e=>{ drawing=true; last=pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0],last[1],1.1,0,7); ctx.fillStyle="#0F1E2E"; ctx.fill(); };
  c.onpointermove=e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; };
  const end=()=>{ if(!drawing) return; drawing=false; S.sig[id]=c.toDataURL("image/png"); };
  c.onpointerup=end; c.onpointercancel=end; c.onpointerleave=end;
}
function sigData(id){ const src=S.sig[id]; if(!src) return Promise.resolve(null);
  return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const w=360, h=Math.round(w*im.height/im.width); const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const x=cv.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); res(cv.toDataURL("image/jpeg",0.7)); }; im.onerror=()=>res(null); im.src=src; }); }
function photoBox(id){ const p=S.photo[id];
  return `<div class="photo"><input type="file" id="${id}" accept="image/*" capture="environment" class="vh">
    ${p?`<img class="thumb" src="${p}" alt="Foto adjunta">`:""}<button class="btn" type="button" data-act="photo" data-id="${id}">${p?"Cambiar foto":"Agregar foto del daño"}</button>${p?`<button class="btn ghost" type="button" data-act="photo-del" data-id="${id}">Quitar</button>`:""}</div>`; }
function compressPhoto(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{ const max=900, sc=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement("canvas"); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); URL.revokeObjectURL(u); res(cv.toDataURL("image/jpeg",0.62)); };
  im.onerror=e=>{ URL.revokeObjectURL(u); rej(e); }; im.src=u; }); }

  workers:{label:"Trabajadores", cols:["Nombre","RUT","Cuadrilla","Cargo"], keys:["nombre","rut","cuadrilla","cargo"],
    alias:{nombre:["nombre","trabajador","nombre y apellido"],rut:["rut","run"],cuadrilla:["cuadrilla","grupo","equipo"],cargo:["cargo","especialidad","puesto"]}},
  cons:{label:"Consumibles", cols:["Código","Nombre","Unidad","Stock","Stock mínimo","Ubicación"], keys:["codigo","nombre","unidad","stock","minimo","ubicacion"],
    alias:{codigo:["codigo","cod"],nombre:["nombre","consumible","descripcion","insumo"],unidad:["unidad","um","u m"],stock:["stock","cantidad","existencia"],minimo:["minimo","stock minimo","min"],ubicacion:["ubicacion","estante","lugar"]}}};
const normH = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[°º.#]/g,"").replace(/\s+/g," ").trim();
function toISO(v){ if(v==null||v==="") return null; if(v instanceof Date&&!isNaN(v)) return isoOf(v);
  if(typeof v==="number"&&v>20000&&v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return isoOf(new Date(d.getTime()+d.getTimezoneOffset()*6e4)); }
  const s=String(v).trim(); let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; } return null; }
function mapRows(aoa,tipo){
  const def=IMP[tipo]; aoa=aoa.filter(r=>r&&r.some(c=>String(c??"").trim()!==""));
  if(!aoa.length) return [];
  const head=aoa[0].map(normH); const idx={}; let hits=0;
  def.keys.forEach(k=>{ const i=head.findIndex(h=>def.alias[k].some(a=>h===a||h.startsWith(a))); if(i>=0){ idx[k]=i; hits++; } });
  let body=aoa; if(hits>=1&&idx.nombre!==undefined) body=aoa.slice(1); else def.keys.forEach((k,i)=>idx[k]=i);
  return body.map(r=>{ const o={}; def.keys.forEach(k=>{ const v=idx[k]!==undefined?r[idx[k]]:""; o[k]=v instanceof Date?v:String(v??"").trim(); }); return o; });
}
function parseText(txt){ const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim()); if(!lines.length) return [];
  const sep=lines[0].includes("\t")?"\t":(lines[0].split(";").length>=lines[0].split(",").length?";":",");
  return lines.map(l=>{ const out=[]; let cur="", q=false; for(let i=0;i<l.length;i++){ const ch=l[i]; if(ch==='"'){ if(q&&l[i+1]==='"'){ cur+='"'; i++; } else q=!q; } else if(ch===sep&&!q){ out.push(cur); cur=""; } else cur+=ch; } out.push(cur); return out; }); }
function vImportar(){

async function startScan(mode){

  detector=null;

async function loop(){
  if(!scanning) return; const v=$("#video"); let txt=null;
  if(v.readyState>=2&&v.videoWidth){
    if(detector){ try{ const r=await detector.detect(v); if(r&&r.length) txt=r[0].rawValue; }catch(e){ detector=null; } }
    else if(window.jsQR){ cv=cv||document.createElement("canvas"); const sc=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));
      const w=cv.width=Math.round(v.videoWidth*sc), h=cv.height=Math.round(v.videoHeight*sc); const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(v,0,0,w,h);
      const r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"}); if(r&&r.data) txt=r.data; }
  }
  if(txt){ const now=Date.now();
    if(S.scanMode==="multi"){ if(txt!==lastHit.v||now-lastHit.t>2500){ lastHit={v:txt,t:now}; if(navigator.vibrate) navigator.vibrate(60); handleMulti(txt); } }

}

  ["H-009","Huincha de medir 8 m","Medición","Gabinete B"],["H-010","Equipo oxicorte","Corte y soldadura","Zona D"],["H-011","Juego de llaves combinadas","Manual","Estante A-4"],["H-012","Galletera inalámbrica","Eléctrica","Estante A-2"]];
function doSeed(){ const plus=d=>{ const x=new Date(); x.setDate(x.getDate()+d); return isoOf(x); };
  commit(b=>{ for(const [code,nombre,categoria,ubicacion] of EJEMPLO) if(!toolBy(code)) b.set(col("tools").doc(code),{nombre,categoria,ubicacion,serie:"",estado:"disponible",ejemplo:true,creado:Date.now(),calibVence:code==="H-004"?plus(12):code==="H-008"?plus(200):null}); },"Ejemplo cargado: 12 herramientas."); }
function doDelEj(){ if(commit(b=>{ S.tools.filter(t=>t.ejemplo).forEach(t=>b.delete(col("tools").doc(t.id))); },"Ejemplos borrados.")){ S.armed=null; render(); } }

function readWorker(p){ return {nombre:clean($("#"+p+"-nombre").value),rut:clean($("#"+p+"-rut").value),cuadrilla:clean($("#"+p+"-cuad").value),cargo:clean($("#"+p+"-cargo").value)}; }
function doWAdd(){ const d=readWorker("wa"); if(!d.nombre){ toast("Escribe el nombre."); return; }
  if(S.workers.some(w=>w.nombre.toLowerCase()===d.nombre.toLowerCase()&&(!d.rut||w.rut===d.rut))){ toast("Ese trabajador ya está registrado."); return; }
  const id=workerId(d.rut,d.nombre); if(workerBy(id)){ toast("Ya existe un trabajador con ese RUT."); return; }
  if(commit(b=>b.set(col("workers").doc(id),Object.assign(d,{activo:true,creado:Date.now()})),d.nombre+" registrado.")){ S.wAdd=false; S.noReset=true; render(); } }
function doWEdit(){ const d=readWorker("we"); if(!d.nombre){ toast("Escribe el nombre."); return; } if(commit(b=>b.update(col("workers").doc(S.wsel),d),"Cambios guardados.")){ S.wEdit=false; S.noReset=true; render(); } }
function doWRet(){ const codes=[...document.querySelectorAll("#f-wret .wr:checked")].map(x=>x.value); const tools=codes.map(toolBy).filter(Boolean);
  if(!tools.length){ toast("Selecciona al menos una."); return; } if(devolver(tools,false,"",null)){ S.noReset=true; render(); } }

function readCons(p,add){ const d={codigo:normCode($("#"+p+"-cod").value),nombre:clean($("#"+p+"-nombre").value),unidad:clean($("#"+p+"-uni").value)||"un",minimo:num($("#"+p+"-min").value),ubicacion:clean($("#"+p+"-ubi").value)};
  if(add) d.stock=num($("#"+p+"-stock").value); return d; }
function doCAdd(){ const d=readCons("ca",true); if(!d.nombre){ toast("Escribe el nombre."); return; }
  if(commit(b=>b.set(col("cons").doc("c"+uid()),Object.assign(d,{creado:Date.now()})),d.nombre+" agregado.")){ S.cAdd=false; S.noReset=true; render(); } }
function doCEdit(){ const d=readCons("ce2",false); if(!d.nombre){ toast("Escribe el nombre."); return; } if(commit(b=>b.update(col("cons").doc(S.csel),d),"Cambios guardados.")){ S.cEdit=false; S.noReset=true; render(); } }
function doCMov(tipo){ const c=consBy(S.csel); const cant=num($(tipo==="salida"?"#cs-cant":"#ce-cant").value);
  if(!(cant>0)){ toast("Indica una cantidad mayor que cero."); return; }
  let who={persona:"",workerId:null,cuadrilla:""}, det="";
  if(tipo==="salida"){ who=resolveWorker($("#cs-w").value); if(!who){ toast("Indica a quién se entrega."); return; } if(cant>num(c.stock)){ toast(`Solo hay ${fmtN(c.stock)} ${c.unidad||""} en stock.`); return; } }
  else det=clean($("#ce-det").value);
  if(commit(b=>{ b.update(col("cons").doc(c.id),{stock:inc(tipo==="salida"?-cant:cant)}); b.set(col("cmovs").doc(),{ts:Date.now(),tipo,cid:c.id,nombre:c.nombre,unidad:c.unidad||"",cant,persona:who.persona,workerId:who.workerId,cuadrilla:who.cuadrilla,detalle:det}); },
    tipo==="salida"?`Entregado: ${fmtN(cant)} ${c.unidad||""} a ${who.persona}.`:`Ingreso de ${fmtN(cant)} ${c.unidad||""} registrado.`)){ S.noReset=true; render(); } }

function readIz(p){ const n=id=>{ const v=$("#"+id).value; return v===""?null:num(v); };
  return {tipo:$("#"+p+"-tipo").value,desc:clean($("#"+p+"-desc").value),wll:n(p+"-wll"),largo:n(p+"-largo"),serie:clean($("#"+p+"-serie").value),cert:clean($("#"+p+"-cert").value),certVence:$("#"+p+"-vence").value||null}; }
function doZAdd(){ const code=normCode($("#za-code").value), d=readIz("za"); if(!code||d.wll==null){ toast("Completa código y capacidad WLL."); return; } if(izBy(code)){ toast(code+" ya existe."); return; }
  if(commit(b=>b.set(col("izaje").doc(code),Object.assign(d,{insp:null,fuera:false,creado:Date.now()})),`${code} registrado. Inspecciónalo para dejarlo apto.`)){ S.zAdd=false; openIz(code); } }
function doZEdit(){ const d=readIz("ze"); if(d.wll==null){ toast("La capacidad WLL es obligatoria."); return; } if(commit(b=>b.update(col("izaje").doc(S.zsel),d),"Cambios guardados.")){ S.zEdit=false; S.noReset=true; render(); } }
function doZInsp(){ const it=izBy(S.zsel), P=periodo(); const inspector=clean($("#zi-insp").value); if(!inspector){ toast("Indica quién inspecciona."); return; }
  const fallas=[...document.querySelectorAll("#f-zinsp .zf:checked")].map(x=>x.value), nota=clean($("#zi-nota").value), apto=!fallas.length, ts=Date.now();
  if(commit(b=>{ b.update(col("izaje").doc(it.id),apto?{insp:{ts,periodo:P.key,color:P.color,inspector,resultado:"apto"}}:{insp:null,fuera:true,motivo:fallas.join(", ")});
    b.set(col("izinsps").doc(),{ts,code:it.id,tipo:it.tipo,desc:it.desc||"",periodo:P.key,color:P.color,inspector,resultado:apto?"apto":"no_apto",fallas,nota}); },
    apto?`${it.id} apto. Márcalo con cinta ${P.color.toLowerCase()}.`:`${it.id} fuera de servicio. Segrégalo y rotúlalo.`)){ S.zInsp=false; S.noReset=true; render(); window.scrollTo(0,0); } }
function doZFuera(){ const it=izBy(S.zsel), m=clean($("#zo-mot").value); if(!m){ toast("Escribe el motivo."); return; }
  if(commit(b=>{ b.update(col("izaje").doc(it.id),{fuera:true,motivo:m,insp:null}); b.set(col("izinsps").doc(),{ts:Date.now(),code:it.id,tipo:it.tipo,desc:it.desc||"",color:"Gris",resultado:"fuera",nota:m}); },`${it.id} fuera de servicio.`)){ S.zFuera=false; S.noReset=true; render(); } }
function doZReint(){ const it=izBy(S.zsel); commit(b=>{ b.update(col("izaje").doc(it.id),{fuera:false,motivo:null,insp:null}); b.set(col("izinsps").doc(),{ts:Date.now(),code:it.id,tipo:it.tipo,desc:it.desc||"",color:"Gris",resultado:"reintegro",nota:"Reintegrado, pendiente de inspección"}); },`${it.id} reintegrado. Falta inspeccionarlo.`); }
function doZCfg(){ const f=$("#zc-freq").value, n=f==="mensual"?12:4, cols=[]; for(let i=0;i<n;i++){ const el=$("#zc-col-"+i); cols.push(el?el.value:(f==="mensual"?DEF_MES:DEF_TRIM)[i]); }
  if(commit(b=>b.set(col("config").doc("izaje"),{freq:f,colores:cols,coloresOk:true},{merge:true}),"Código de colores guardado.")){ S.cfgIz=false; S.noReset=true; render(); } }
const EJ_IZ=[["IZ-001","Eslinga sintética","Eslinga plana 2 capas 3 m",3,3,60],["IZ-002","Eslinga sintética","Eslinga tubular 6 m",5,6,20],["IZ-003","Estrobo de cable","Estrobo 1/2\" ojo-ojo 4 m",1.8,4,200],
  ["IZ-004","Grillete","Grillete lira 3/4\"",4.75,null,300],["IZ-005","Grillete","Grillete lira 1\"",8.5,null,-5],["IZ-006","Tecle de cadena","Tecle de cadena 3 t",3,null,90]];
function doZSeed(){ const P=periodo(), plus=d=>{ const x=new Date(); x.setDate(x.getDate()+d); return isoOf(x); };
  commit(b=>EJ_IZ.forEach(([code,tipo,desc,wll,largo,dv],i)=>b.set(col("izaje").doc(code),{tipo,desc,wll,largo,serie:"",cert:"CERT-"+(1001+i),certVence:plus(dv),insp:i%3===2?null:{ts:Date.now(),periodo:P.key,color:P.color,inspector:"(ejemplo)",resultado:"apto"},fuera:false,ejemplo:true,creado:Date.now()})),"Ejemplo de izaje cargado."); }
function doZDelEj(){ if(commit(b=>S.iz.filter(i=>i.ejemplo).forEach(i=>b.delete(col("izaje").doc(i.id))),"Ejemplos borrados.")){ S.armed=null; render(); } }

/* ================= Salidas ================= */
function summaryText(){
  const now=Date.now(), c=counts(), n=new Date();
  const prest=S.tools.filter(t=>t.estado==="prestada").sort((a,b)=>(a.desde||0)-(b.desde||0)), mant=S.tools.filter(t=>t.estado==="mantencion"), ext=S.tools.filter(t=>t.estado==="extraviada");
  let s=`*${(S.config.nombre||"PAÑOL").toUpperCase()} — ENTREGA DE TURNO*\n${n.toLocaleDateString("es-CL")} ${fmtT(n)}\n\nDisponibles: ${c.disponible} · Prestadas: ${c.prestada} · Mantención: ${c.mantencion} · Extraviadas: ${c.extraviada||0}\n`;
  s+= prest.length?`\n*PRESTADAS (${prest.length}):*\n`+prest.map(t=>`• ${t.id} ${t.nombre} — ${t.persona||"?"}${t.cuadrilla?" ["+t.cuadrilla+"]":""}${t.area?" ("+t.area+")":""}, desde ${fmtT(t.desde)}, ${fmtDur(now-t.desde)}${now-t.desde>SHIFT_H*3600e3?" ⚠ PASÓ EL TURNO":""}`).join("\n")+"\n":"\nNo hay herramientas prestadas.\n";
  if(mant.length) s+=`\n*EN MANTENCIÓN (${mant.length}):*\n`+mant.map(t=>`• ${t.id} ${t.nombre}${t.nota?" — "+t.nota:""}`).join("\n")+"\n";
  if(ext.length) s+=`\n*EXTRAVIADAS (${ext.length}):*\n`+ext.map(t=>`• ${t.id} ${t.nombre}${t.persona?" — resp. "+t.persona:""}`).join("\n")+"\n";
  const cal=S.tools.filter(t=>{ const x=calib(t); return x&&x.code!=="ok"; }); if(cal.length) s+=`\n*CALIBRACIONES:*\n`+cal.map(t=>`• ${t.id} ${t.nombre} — ${calib(t).txt}`).join("\n")+"\n";
  const low=S.cons.filter(x=>num(x.stock)<=num(x.minimo)); if(low.length) s+=`\n*STOCK BAJO:*\n`+low.map(x=>`• ${x.nombre}: ${fmtN(x.stock)} ${x.unidad||""} (mín. ${fmtN(x.minimo)})`).join("\n")+"\n";
  return s;
}
async function shareText(text,okMsg){ if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }catch(e){ toast("No se pudo copiar."); } }
function printCards(html){ if(!window.QRCode){ toast("No cargó el generador de QR. Revisa la señal y recarga."); return; } $("#print").innerHTML=html; setTimeout(()=>window.print(),150); }
function labels(){ printCards(visible().map(t=>`<div class="lb"><img src="${qrDataUrl(qrText(t.id),300)}" alt=""><div class="tx"><div class="cd">${esc(t.id)}</div><div class="nm">${esc(t.nombre)}</div><img class="lgo" src="${LOGO}" alt=""></div></div>`).join("")); }
function wLabels(list){ printCards(list.map(w=>`<div class="lb"><img src="${qrDataUrl(BASE+"?w="+encodeURIComponent(w.id),300)}" alt=""><div class="tx"><div class="nm" style="font-size:3.6mm">${esc(w.nombre)}</div><div class="cq">${esc([w.cuadrilla,w.cargo].filter(Boolean).join(" · "))}</div><div class="cq">${esc(w.rut||"")}</div><img class="lgo" src="${LOGO}" alt=""></div></div>`).join("")); }
function zLabels(){ const q=S.zq.trim().toLowerCase(); const list=S.iz.filter(it=>!q||[it.id,it.tipo,it.desc].join(" ").toLowerCase().includes(q)).sort((a,b)=>a.id.localeCompare(b.id,"es",{numeric:true}));
  printCards(list.map(it=>`<div class="lb"><img src="${qrDataUrl(BASE+"?z="+encodeURIComponent(it.id),300)}" alt=""><div class="tx"><div class="cd">${esc(it.id)}</div><div class="wl">WLL ${fmtN(it.wll)} t</div><div class="nm">${esc(it.desc||it.tipo)}</div><img class="lgo" src="${LOGO}" alt=""></div></div>`).join("")); }
async function saveFile(name,content,type){
  const file=new File([content],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/android|iphone|ipad/i.test(navigator.userAgent)){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }
const cell=v=>{ const s=String(v??""); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
const toCsv=rows=>"﻿"+rows.map(r=>r.map(cell).join(";")).join("\r\n");
function csv(){ const rows=[["Fecha","Hora","Movimiento","Código","Herramienta","Persona","Cuadrilla","Área","Condición","Observación","Horas fuera","Firma"]];
  S.movs.forEach(m=>rows.push([new Date(m.ts).toLocaleDateString("es-CL"),fmtT(m.ts),TIPO[m.tipo]||m.tipo,m.code,m.nombre||"",m.persona||"",m.cuadrilla||"",m.area||"",m.cond||"",m.nota||"",m.dur?(m.dur/3600e3).toFixed(1).replace(".",","):"",m.firma?"Sí":""]));
  saveFile(`historial-panol-${todayISO()}.csv`,toCsv(rows),"text/csv"); }
function ccsv(){ const rows=[["Fecha","Hora","Movimiento","Consumible","Cantidad","Unidad","Persona","Cuadrilla","Detalle"]];
  S.cmovs.forEach(m=>rows.push([new Date(m.ts).toLocaleDateString("es-CL"),fmtT(m.ts),m.tipo==="entrada"?"Ingreso":"Entrega",m.nombre,String(m.cant).replace(".",","),m.unidad||"",m.persona||"",m.cuadrilla||"",m.detalle||""]));
  saveFile(`consumibles-${todayISO()}.csv`,toCsv(rows),"text/csv"); }
async function showDoc(colName,id,title){
  try{ const d=await col(colName).doc(id).get(); if(!d.exists){ toast("No se encontró."); return; }
    const box=document.createElement("div"); box.className="panel"; box.innerHTML=`<div class="backbar"><h2>${title}</h2><button class="btn ghost" type="button">Cerrar</button></div><img class="${colName==="firmas"?"sigimg":"fullphoto"}" src="${d.data().data}" alt="${title}">`;
    box.querySelector("button").onclick=()=>box.remove(); $("#main").prepend(box); window.scrollTo(0,0);
  }catch(e){ toast("No se pudo cargar (¿sin señal?)."); } }

/* ================= Eventos ================= */
function arm(k){ S.armed=k; render(); clearTimeout(armT); armT=setTimeout(()=>{ if(S.armed===k){ S.armed=null; render(); } },5000); }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  if(!["del","del-ej","logout","w-del","c-del","z-del","z-delej"].includes(a)&&S.armed) S.armed=null;
  const V=b.dataset.v;
  switch(a){
    case "nav": if(V==="mover"&&S.view==="mover") S.sel=null; S.noReset=true; go(V); break;
    case "go": if(V==="importar"&&b.dataset.t){ S.imp={tipo:b.dataset.t,rows:null,name:""}; } S.noReset=true; go(V); break;
    case "scan": startScan("single"); break;
    case "nueva": S.sel=null; S.noReset=true; go("mover"); setTimeout(()=>{ const w=$("#c-worker"); w&&w.focus(); },50); break;
    case "devol-scan": S.scanMsg="Escanea la herramienta que están devolviendo."; startScan("single"); break;
    case "pend": { if(S.tools.some(t=>t.estado==="prestada"&&Date.now()-(t.desde||0)>SHIFT_H*3600e3)){ S.filter="prestada"; } else if(S.tools.some(t=>t.estado==="mantencion")) S.filter="mantencion"; else if(S.tools.some(t=>t.estado==="extraviada")) S.filter="extraviada"; else { toast("No hay pendientes."); break; } S.noReset=true; go("inventario"); break; }
    case "scan-multi": S.cart.worker=$("#c-worker").value; S.cart.area=$("#c-area").value; startScan("multi"); break;
    case "scan-close": stopScan(); break;
    case "torch": toggleTorch(); break;
    case "open": openCode(b.dataset.code); break;
    case "close-sel": S.sel=null; S.noReset=true; render(); break;
    case "goinv": S.filter=b.dataset.f; S.noReset=true; go("inventario"); break;
    case "filter": S.filter=b.dataset.f; render(); break;
    case "add-open": S.addOpen=true; S.addCode=""; S.noReset=true; go("inventario"); setTimeout(()=>{ const n=$("#a-nombre"); n&&n.focus(); },30); break;
    case "add-close": S.addOpen=false; S.noReset=true; render(); break;
    case "edit-toggle": S.editOpen=!S.editOpen; S.noReset=true; render(); break;
    case "ext-toggle": S.extOpen=!S.extOpen; S.noReset=true; render(); break;
    case "habilitar": doHabilitar(); break;
    case "recuperada": doRecup(); break;
    case "seed": doSeed(); break;
    case "del": { const k="del:"+b.dataset.code; if(S.armed===k) doDelete(b.dataset.code); else arm(k); break; }
    case "del-ej": if(S.armed==="ej") doDelEj(); else arm("ej"); break;
    case "cart-add": { const c=normCode($("#c-add").value); S.cart.worker=$("#c-worker").value; S.cart.area=$("#c-area").value; if(c&&cartAdd(c)){ $("#c-add").value=""; render(); } break; }
    case "cart-del": S.cart.items=S.cart.items.filter(x=>x!==b.dataset.code); S.cart.worker=$("#c-worker").value; S.cart.area=$("#c-area").value; render(); break;
    case "cart-clear": S.cart={worker:"",items:[],area:""}; delete S.sig["sig-cart"]; S.noReset=true; render(); break;
    case "sig-clear": delete S.sig[b.dataset.id]; { const c=document.getElementById(b.dataset.id); if(c) c.getContext("2d").clearRect(0,0,c.width,c.height); } break;
    case "photo": document.getElementById(b.dataset.id).click(); break;
    case "photo-del": delete S.photo[b.dataset.id]; render(); break;
    case "ver-firma": showDoc("firmas",b.dataset.id,"Firma"); break;
    case "ver-foto": showDoc("fotos",b.dataset.id,"Foto del daño"); break;
    case "summary": shareText(summaryText(),"Resumen copiado. Pégalo en WhatsApp."); break;
    case "labels": labels(); break;
    case "csv": csv(); break;
    case "ccsv": ccsv(); break;
    /* trabajadores */
    case "w-add": S.wAdd=!S.wAdd; S.noReset=true; if(S.view!=="trabajadores") go("trabajadores"); else render(); break;
    case "w-open": S.wsel=b.dataset.id; S.wEdit=false; S.noReset=true; go("trabajador"); break;
    case "w-edit": S.wEdit=!S.wEdit; S.noReset=true; render(); break;
    case "w-del": if(S.armed==="wdel"){ if(commit(bb=>bb.delete(col("workers").doc(S.wsel)),"Trabajador eliminado.")){ S.armed=null; S.noReset=true; go("trabajadores"); } } else arm("wdel"); break;
    case "w-labels": { const q=S.wq.trim().toLowerCase(); wLabels(S.workers.filter(w=>!q||[w.nombre,w.rut,w.cuadrilla,w.cargo].join(" ").toLowerCase().includes(q)).sort((x,y)=>x.nombre.localeCompare(y.nombre,"es"))); break; }
    case "w-label1": wLabels([workerBy(S.wsel)]); break;
    case "w-cart": { const w=workerBy(S.wsel); S.cart.worker=wLabel(w); S.sel=null; S.noReset=true; go("mover"); break; }
    /* consumibles */
    case "c-add": S.cAdd=!S.cAdd; S.noReset=true; render(); break;
    case "c-open": S.csel=b.dataset.id; S.cEdit=false; S.noReset=true; go("consumible"); break;
    case "c-edit": S.cEdit=!S.cEdit; S.noReset=true; render(); break;
    case "c-del": if(S.armed==="cdel"){ if(commit(bb=>bb.delete(col("cons").doc(S.csel)),"Consumible eliminado.")){ S.armed=null; S.noReset=true; go("consumibles"); } } else arm("cdel"); break;
    /* izaje */
    case "z-open": openIz(b.dataset.id); break;
    case "z-add": S.zAdd=!S.zAdd; S.noReset=true; render(); break;
    case "z-cfg": S.cfgIz=!S.cfgIz; S.noReset=true; render(); break;
    case "z-filter": S.zfilter=b.dataset.f; render(); break;
    case "z-insp": S.zInsp=!S.zInsp; S.noReset=true; render(); break;
    case "z-edit": S.zEdit=!S.zEdit; S.zFuera=false; S.noReset=true; render(); break;
    case "z-fuera": S.zFuera=!S.zFuera; S.zEdit=false; S.noReset=true; render(); break;
    case "z-reint": doZReint(); break;
    case "z-seed": doZSeed(); break;
    case "z-labels": zLabels(); break;
    case "z-del": if(S.armed==="zdel"){ if(commit(bb=>bb.delete(col("izaje").doc(S.zsel)),"Elemento eliminado.")){ S.armed=null; S.noReset=true; go("izaje"); } } else arm("zdel"); break;
    case "z-delej": if(S.armed==="zej") doZDelEj(); else arm("zej"); break;
    /* importar */
    case "imp-tipo": S.imp={tipo:b.dataset.t,rows:null,name:""}; render(); break;
    case "imp-file": $("#imp-file").click(); break;
    case "imp-paste": { const t=$("#imp-txt").value; if(!t.trim()){ toast("Pega primero las filas desde Excel."); break; } S.imp.rows=mapRows(parseText(t),S.imp.tipo); S.imp.name=""; render(); break; }
    case "imp-go": doImport(); break;
    case "imp-plantilla": { const d=IMP[S.imp.tipo]; saveFile(`plantilla-${d.label.toLowerCase()}.csv`,toCsv([d.cols]),"text/csv"); break; }
    /* ajustes */
    case "share-link": { const sup=b.dataset.l==="sup"; const l=BASE+"?k="+encodeURIComponent(K)+(sup?"&r=sup":""); shareText(`${sup?"Acceso de supervisor (solo lectura) al":"Acceso al"} ${S.config.nombre||"Pañol Digital"}: ${l}`,"Enlace copiado."); break; }
    case "copy-link": navigator.clipboard.writeText(BASE+"?k="+encodeURIComponent(K)).then(()=>toast("Enlace copiado."),()=>toast("No se pudo copiar.")); break;
    case "install": if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); } break;
    case "no-install": lsSet("panol.noInstall","1"); render(); break;
    case "logout": if(S.armed==="logout"){ lsSet(LS_KEY,null); lsSet(LS_ROL,null); location.href=BASE; } else arm("logout"); break;
  }
});
document.addEventListener("submit",e=>{ e.preventDefault(); const id=e.target.id;
  const F={"f-code":()=>openCode($("#m-code").value),"f-retiro":doRetiro,"f-cart":doCart,"f-devol":doDevol,"f-add":doAdd,"f-edit":doEdit,"f-ext":doExt,
    "f-key":()=>enterKey($("#k-in").value),"f-new":()=>createPanol($("#n-name").value),
    "f-name":()=>commit(b=>b.set(col("config").doc("app"),{nombre:clean($("#s-name").value),firmaObligatoria:$("#s-firma").checked},{merge:true}),"Ajustes guardados."),
    "f-wa":doWAdd,"f-we":doWEdit,"f-wret":doWRet,"f-ca":doCAdd,"f-ce2":doCEdit,"f-csal":()=>doCMov("salida"),"f-cent":()=>doCMov("entrada"),
    "f-za":doZAdd,"f-ze":doZEdit,"f-zinsp":doZInsp,"f-zfuera":doZFuera,"f-izcfg":doZCfg};
  (F[id]||(()=>{}))(); });
document.addEventListener("input",e=>{ const id=e.target.id;
  if(id==="i-q"){ S.q=e.target.value; render(); } else if(id==="w-q"){ S.wq=e.target.value; render(); } else if(id==="c-q"){ S.cq=e.target.value; render(); } else if(id==="z-q"){ S.zq=e.target.value; render(); } });
document.addEventListener("change",async e=>{ const el=e.target;
  if(el.classList&&el.classList.contains("zf")) syncInspBtn();
  if(el.id==="zc-freq"){ const prev=S.izcfg; S.izcfg=Object.assign({},prev,{freq:el.value,colores:null}); S.noReset=true; render(); S.izcfg=prev; $("#zc-freq").value=el.value; }
  if(el.id==="imp-file"&&el.files&&el.files[0]){ const f=el.files[0]; try{ const aoa=await readImportFile(f); if(!aoa) return; S.imp.rows=mapRows(aoa,S.imp.tipo); S.imp.name=f.name; render(); }catch(err){ toast("No se pudo leer el archivo."); } }
  if(el.type==="file"&&el.id&&el.id.startsWith("ph-")&&el.files&&el.files[0]){ try{ S.photo[el.id]=await compressPhoto(el.files[0]); render(); }catch(err){ toast("No se pudo leer la foto."); } }
});
window.addEventListener("online",setSync); window.addEventListener("offline",setSync);
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(S.phase==="app") render(); });

/* ================= Arranque ================= */
function makeKey(){ const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; const r=crypto.getRandomValues(new Uint32Array(8)); let s=""; for(let i=0;i<8;i++){ s+=A[r[i]%A.length]; if(i===3) s+="-"; } return "PV2-"+s; }
function createPanol(nombre){ const k=makeKey(); K=k; lsSet(LS_KEY,k); lsSet(LS_ROL,null); S.ro=false;
  fs.collection(`panoles/${k}/config`).doc("app").set({nombre:clean(nombre)||"Pañol",creado:Date.now()}).catch(()=>{});
  startApp(); S.view="ajustes"; toast("Pañol creado. Guarda la clave que aparece aquí."); render(); }
function enterKey(raw){ const k=normKey(raw); if(k.length<12){ S.err="Revisa la clave: tiene el formato PV2-XXXX-XXXX."; render(); return; } S.err=""; K=k; lsSet(LS_KEY,k); startApp(); }
function listen(name,fn,q){ unsubs.push((q||col(name)).onSnapshot(fn,err=>console.error(name,err))); }
function startApp(){
  unsubs.forEach(u=>u()); unsubs=[]; S.phase="app"; S.loaded=false; S.ro=lsGet(LS_ROL)==="sup"; if(S.view!=="ajustes") S.view="panol"; render();
  unsubs.push(col("tools").onSnapshot({includeMetadataChanges:true},snap=>{
    S.tools=snap.docs.map(d=>Object.assign({id:d.id},d.data())); S.pendingWrites=snap.metadata.hasPendingWrites;
    const first=!S.loaded; S.loaded=true; if(S.sel&&!toolBy(S.sel)) S.sel=null;
    if(first&&S.pending){ const p=S.pending; S.pending=null; if(p.startsWith("w:")) handleScan(BASE+"?w="+encodeURIComponent(p.slice(2))); else if(p.startsWith("z:")) setTimeout(()=>openIz(p.slice(2)),600); else openCode(p); } else render();
  },err=>{ console.error(err); toast(err.code==="permission-denied"?"Sin permiso. Revisa las reglas de Firestore.":"Error de conexión con la base de datos."); }));
  listen("movs",s=>{ S.movs=s.docs.map(d=>d.data()); if(S.loaded) render(); },col("movs").orderBy("ts","desc").limit(1000));
  listen("workers",s=>{ S.workers=s.docs.map(d=>Object.assign({id:d.id},d.data())); if(S.loaded) render(); });
  listen("cons",s=>{ S.cons=s.docs.map(d=>Object.assign({id:d.id},d.data())); if(S.loaded) render(); });
  listen("cmovs",s=>{ S.cmovs=s.docs.map(d=>d.data()); if(S.loaded) render(); },col("cmovs").orderBy("ts","desc").limit(1000));
  listen("izaje",s=>{ S.iz=s.docs.map(d=>Object.assign({id:d.id},d.data())); if(S.loaded) render(); });
  listen("izinsps",s=>{ S.izi=s.docs.map(d=>d.data()); if(S.loaded) render(); },col("izinsps").orderBy("ts","desc").limit(500));
  unsubs.push(col("config").doc("app").onSnapshot(s=>{ S.config=s.exists?s.data():{}; render(); },()=>{}));
  unsubs.push(col("config").doc("izaje").onSnapshot(s=>{ S.izcfg=s.exists?s.data():{}; if(S.loaded) render(); },()=>{}));
}

tick(); setInterval(()=>{ tick(); if(S.phase==="app"&&S.loaded&&(S.view==="panol"||S.view==="mover")&&!document.activeElement?.matches("input,textarea,select")&&$("#scan").hidden&&!$(".sig canvas")) render(); },60000);
render();

(async()=>{
  const params=new URLSearchParams(location.search);
  const pk=params.get("k"), ph=params.get("h"), pw=params.get("w"), pz=params.get("z"), pr=params.get("r");
  if(pk){ lsSet(LS_KEY,normKey(pk)); lsSet(LS_ROL,pr==="sup"?"sup":null); }
  if(ph) S.pending=normCode(ph); if(pw) S.pending="w:"+pw; if(pz) S.pending="z:"+normCode(pz);
  if(pk||ph||pw||pz) history.replaceState(null,"",BASE);
  else if(location.hash.length>1) S.pending=normCode(decodeURIComponent(location.hash.slice(1)));
  const cfg=window.FIREBASE_CONFIG||{};
  if(!window.firebase||!cfg.apiKey||cfg.apiKey==="PEGAR_AQUI"){ S.phase="setup"; if(!window.firebase) toast("No cargó Firebase. Revisa la señal."); render(); return; }
  firebase.initializeApp(cfg); fs=firebase.firestore();
  try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){ firebase.auth().signInAnonymously().catch(()=>{ S.phase="login"; S.err=navigator.onLine?"No se pudo iniciar sesión: activa el acceso Anónimo en Firebase → Authentication.":"Necesitas señal la primera vez que abres la app."; render(); }); return; }
    if(S.phase==="app") return;
    const k=lsGet(LS_KEY); if(k){ K=k; startApp(); } else { S.phase="login"; render(); }
  });
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
})();

</script>
